<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKL Transformation Challenge</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: #0b0f14;
  color: #111827;
}

button, input, select { font: inherit; }
button { cursor: pointer; }

.app {
  min-height: 100vh;
}

.main {
  padding: 28px 16px 96px;
  background: #0b0f14;
  min-height: 100vh;
}

.sidebar {
  display: none;
}

.page {
  display: none !important;
}

.page.active {
  display: block !important;
}

.page.active {
  display: block;
}

h1 {
  margin: 8px 0;
  font-size: 32px;
  line-height: 1.05;
  letter-spacing: -0.04em;
  color: #f9fafb;
}

h2, h3, strong {
  color: #f9fafb;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: .12em;
  color: #9ca3af;
  font-size: 12px;
  font-weight: 800;
}

.muted {
  color: #a3aab8;
  font-size: 14px;
  line-height: 1.5;
}

.panel,
.mobile-card,
.profile-card,
.stat-box,
.hero-card {
  background: #172033;
  border: 1px solid #2f3b4d;
  border-radius: 22px;
  color: #f9fafb;
}

.panel {
  overflow: hidden;
}

.panel-head {
  padding: 20px;
  border-bottom: 1px solid #1f2937;
}

.panel-body {
  padding: 20px;
}

.hero-card {
  padding: 24px;
  margin-bottom: 20px;
}

.hero-card h1 {
  font-size: 34px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #374151;
  border-radius: 14px;
  outline: none;
  background: #0b1220;
  color: #f9fafb;
}

input::placeholder {
  color: #9ca3af;
}

.btn {
  border: 0;
  border-radius: 14px;
  padding: 12px 15px;
  font-weight: 800;
  font-size: 14px;
}

.btn-dark,
.btn-blue {
  background: #2563eb;
  color: white;
}

.btn-light {
  background: #1f2937;
  color: white;
  border: 1px solid #374151;
}

.btn-red {
  color: #f87171;
  background: transparent;
  border: 0;
  font-weight: 800;
}

.avatar {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: #1f2937;
  color: white;
  display: grid;
  place-items: center;
  font-weight: 900;
  flex-shrink: 0;
}

.task {
  width: 100%;
  display: grid;
  grid-template-columns: 52px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 16px;
  margin-bottom: 16px;
  border-radius: 20px;
  background: #111827;
  border: 1px solid rgba(255,255,255,.04);
  box-shadow: 0 6px 18px rgba(0,0,0,.18);
  color: #111827;
  text-align: left;
}

.task-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: rgba(255,255,255,.05);
  display: grid;
  place-items: center;
  font-size: 21px;
  color: white;
}

.task-name {
  color: #ffffff;
  font-weight: 800;
  font-size: 15px;
}

.task-points {
    color: #ffffff;
  font-weight: 900;
  font-size: 15px;
}

.task.active {
  background: #172033;
  border-color: #3b82f6;
}

.task.active .task-name,
.task.active .task-points {
  color: white;
}

.mobile-cards {
  display: grid;
  gap: 12px;
}

.mobile-card {
  padding: 16px;
}

.stat-box {
  padding: 14px;
}

.bar {
  height: 7px;
  background: rgba(255,255,255,.14);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 8px;
  width: 100%;
}

.fill {
  height: 100%;
  background: white;
  border-radius: 999px;
}

.desktop-table,
table {
  display: none;
}

.bottom-nav {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  height: 68px;
  background: #111827;
  border: 1px solid #2f3b4d;
  border-radius: 24px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 8px;
  z-index: 80;
  box-shadow: 0 12px 30px rgba(0,0,0,.35);
}

.bottom-nav button {
  border: 0;
  background: transparent;
  color: #9ca3af;
  border-radius: 18px;
  font-size: 11px;
  font-weight: 800;
  display: grid;
  place-items: center;
  gap: 2px;
}

.bottom-nav button span {
  font-size: 19px;
}

.bottom-nav button.active {
  background: #2563eb;
  color: white;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 100;
  padding: 18px;
  align-items: center;
  justify-content: center;
}

.modal.open {
  display: flex;
}

.modal-box {
  width: min(1100px, 100%);
  max-height: 90vh;
  overflow: auto;
  background: #111827;
  color: white;
  border-radius: 24px;
  border: 1px solid #2f3b4d;
}

.modal-head {
  padding: 22px 24px;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-content {
  padding: 24px;
}

.team-manager {
  display: none;
  margin-top: 18px;
  gap: 14px;
}

.team-manager.open {
  display: grid;
  grid-template-columns: 1fr;
}

.team-box {
  border: 1px solid #2f3b4d;
  border-radius: 16px;
  padding: 16px;
}

.pill {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  background: #1f2937;
  padding: 6px 10px;
  border-radius: 999px;
  margin: 4px;
  font-size: 13px;
}
</style>
</head>

<body>
  <div id="app"></div>

  <script>
    const ADMIN_CODE = "hkladmin";

    const tasks = [
  ["Exercise for 45 mins", 2],
  ["HKL pledge", 2],
  ["Nitnem or Japji Sahib", 2],
  ["Sit with yourself for 10 mins", 3],
  ["Write grateful + befqoofia", 2],
  ["Morning Simran", 5],
  ["Listen to Bachans and take notes", 4],
  ["HKL signup", 4],
  ["Bring someone new to an HKL club event", 5],
  ["General kindness acts", 5],
];

    const defaultTeams = [
      { id: 1, name: "Alpha", members: ["Gurkirat", "Member B"] },
      { id: 2, name: "Beta", members: ["Member C", "Member D"] },
      { id: 3, name: "Gamma", members: ["Member E", "Member F"] },
    ];

    const defaultLogs = [
      { id: 1, teamId: 1, member: "Gurkirat", task: "Wake up for Simran", points: 10, note: "Day 1", date: "2026-05-01" },
      { id: 2, teamId: 1, member: "Gurkirat", task: "Wake up for Simran", points: 10, note: "Day 2", date: "2026-05-02" },
      { id: 3, teamId: 1, member: "Gurkirat", task: "Wake up for Simran", points: 10, note: "Day 3", date: "2026-05-03" },
      { id: 4, teamId: 1, member: "Gurkirat", task: "Exercise for 45 minutes", points: 15, note: "Gym", date: "2026-05-04" },
      { id: 5, teamId: 2, member: "Member C", task: "Exercise for 45 minutes", points: 15, note: "Workout", date: "2026-05-04" },
    ];

    let state = {
      teams: JSON.parse(localStorage.getItem("hklTeams")) || defaultTeams,
      logs: JSON.parse(localStorage.getItem("hklLogs")) || defaultLogs,
      isAdmin: false,
      selectedTeam: Number(localStorage.getItem("hklSelectedTeam")) || 1,
      selectedMember: localStorage.getItem("hklSelectedMember") || "Gurkirat",
      profileSaved: localStorage.getItem("hklProfileSaved") === "true",
      selectedTasks: [],
      showHistory: false,
      showAdmin: false,
showTeamManager: false,
activePage: "teams",
search: "",
    };

    const today = () => {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
};

    function saveTeamsToSheet() {
  const formData = new FormData();
  formData.append("type", "teams");
  formData.append("teams", JSON.stringify(state.teams));

  fetch("https://script.google.com/macros/s/AKfycbzYpou1mRPjxW6fKNViOQgmxT3GFkvn8xVGQjlO3bOEf5grRjLStMNjQjA91ggc8BvY/exec", {
    method: "POST",
    body: formData
  });
}

    function teamName(id) {
      return state.teams.find(t => t.id === id)?.name || "Unknown";
    }

    function currentTeam() {
      return state.teams.find(t => t.id === Number(state.selectedTeam)) || state.teams[0];
    }

    function initials(name) {
      return name.split(" ").map(x => x[0]).join("").slice(0,2).toUpperCase();
    }

    function getStreak(member, taskName) {
      const dates = new Set(state.logs.filter(l => l.member === member && l.task === taskName).map(l => l.date));
      let streak = 0;
      const d = new Date(today() + "T00:00:00");
      while (dates.has(d.toISOString().slice(0,10))) {
        streak++;
        d.setDate(d.getDate() - 1);
      }
      return streak;
    }

    function memberStats() {
      return state.teams.flatMap(team =>
        team.members.map(member => {
          const logs = state.logs.filter(l => l.teamId === team.id && l.member === member);
          return {
  member,
  teamId: team.id,
  teamName: team.name,
  total: logs.reduce((s,l) => s + l.points, 0),
  today: logs.filter(l => l.date === today()).reduce((s,l) => s + l.points, 0),

  exercise: getStreak(member, "Exercise for 45 mins"),
  nitnem: getStreak(member, "Nitnem or Japji Sahib"),
  simran: getStreak(member, "Morning Simran"),
  bachans: getStreak(member, "Listen to Bachans and take notes"),
};
        })
      ).sort((a,b) => b.total - a.total);
    }

    function leaderboard() {
      return state.teams.map(team => {
        const logs = state.logs.filter(l => l.teamId === team.id);
        return {
          ...team,
          total: logs.reduce((s,l) => s + l.points, 0),
          today: logs.filter(l => l.date === today()).reduce((s,l) => s + l.points, 0),
        };
      }).sort((a,b) => b.total - a.total);
    }

    function rankClass(i) {
      if (i === 0) return "rank gold";
      if (i === 1) return "rank silver";
      if (i === 2) return "rank bronze";
      return "rank";
    }

    function toggleTask(name) {
      state.selectedTasks = state.selectedTasks.includes(name)
        ? state.selectedTasks.filter(t => t !== name)
        : [...state.selectedTasks, name];
      render();
    }

   function submitPoints() {
  if (!state.profileSaved) return alert("Save your profile first.");
  if (!state.selectedTasks.length) return alert("Select at least one task.");

  const note = document.getElementById("note")?.value || "";

  state.selectedTasks.forEach(task => {
    const formData = new FormData();
    formData.append("team", currentTeam().name);
    formData.append("member", state.selectedMember);
    formData.append("task", task);
    formData.append("points", tasks.find(t => t[0] === task)?.[1] || 0);
    formData.append("note", note);
    formData.append("date", new Date().toISOString().slice(0,10));

    fetch("https://script.google.com/macros/s/AKfycbzYpou1mRPjxW6fKNViOQgmxT3GFkvn8xVGQjlO3bOEf5grRjLStMNjQjA91ggc8BvY/exec", {
      method: "POST",
      body: formData
    });
  });
  // instant UI update (fake it locally first)
state.selectedTasks.forEach(task => {
  state.logs.push({
    id: Date.now(),
    teamId: currentTeam().id,
    member: state.selectedMember,
    task: task,
    points: tasks.find(t => t[0] === task)?.[1] || 0,
    note: note,
    date: new Date().toISOString().slice(0,10)
  });
});

state.selectedTasks = [];

// 🔥 instantly update screen
render();

// 🔁 silently sync with sheet (no delay visible)
setTimeout(() => loadFromSheet(), 100);
}
function save() {
  localStorage.setItem("hklTeams", JSON.stringify(state.teams));
  localStorage.setItem("hklLogs", JSON.stringify(state.logs));
  localStorage.setItem("hklSelectedTeam", state.selectedTeam);
  localStorage.setItem("hklSelectedMember", state.selectedMember);
  localStorage.setItem("hklProfileSaved", state.profileSaved);
}
    function saveProfile() {
  state.profileSaved = true;
  save();
  render();
}

    function changeProfile() {
      state.profileSaved = false;
      save();
      render();
    }

    function openHistory() {
      state.showHistory = true;
      render();
    }

    function closeHistory() {
      state.showHistory = false;
      render();
    }

    function openAdmin() {
      state.showAdmin = true;
      render();
    }

    function closeAdmin() {
      state.showAdmin = false;
      render();
    }

    function loginAdmin() {
      const code = document.getElementById("adminCode")?.value;
      if (code === ADMIN_CODE) {
        state.isAdmin = true;
        render();
      } else {
        alert("Wrong admin code.");
      }
    }

    function addTeam() {
  if (!state.isAdmin) return;
  const name = document.getElementById("newTeamName").value.trim();
  const members = document.getElementById("newMembers").value.split(",").map(x => x.trim()).filter(Boolean);
  if (!name) return;

  state.teams.push({ id: Date.now(), name, members: members.length ? members : ["Member not added"] });

  saveTeamsToSheet();
save();
render();

setTimeout(() => loadFromSheet(), 800);
}

    function deleteTeam(id) {
  if (!state.isAdmin) return;

  state.teams = state.teams.filter(t => t.id !== id);

  saveTeamsToSheet();
save();
render();

setTimeout(() => loadFromSheet(), 800);
}

    function deleteMember(teamId, member) {
  if (!state.isAdmin) return;

  state.teams = state.teams.map(t =>
    t.id === teamId ? { ...t, members: t.members.filter(m => m !== member) } : t
  );

  saveTeamsToSheet();
save();
render();

setTimeout(() => loadFromSheet(), 800);
}

    function deleteLog(id) {
      if (!state.isAdmin) return;
      state.logs = state.logs.filter(l => l.id !== id);
      save();
      render();
    }
function goToSection(id) {
  if (id === "history") {
    openHistory();
    return;
  }

  if (id === "admin") {
    openAdmin();
    return;
  }

  document.getElementById(id)?.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}
    function setPage(page) {
  state.activePage = page;
  render();
}
    function render() {
      const lb = leaderboard();
      const ms = memberStats();
      const topTeam = lb[0]?.total || 1;
      const mostActive = [...ms].sort((a,b) => b.today - a.today)[0];
      const simranLeader = [...ms].sort((a,b) => b.simran - a.simran)[0];
      const exerciseLeader = [...ms].sort((a,b) => b.exercise - a.exercise)[0];
      const nitnemLeader = [...ms].sort((a,b) => b.nitnem - a.nitnem)[0];
const bachansLeader = [...ms].sort((a,b) => b.bachans - a.bachans)[0];
      const prizePool = state.teams.reduce((s,t) => s + t.members.length, 0) * 20;
      const selectedTotal = state.selectedTasks.reduce((s, name) => s + tasks.find(t => t[0] === name)[1], 0);
      const selectedStats = ms.find(m => m.member === state.selectedMember && m.teamId === Number(state.selectedTeam));

      document.getElementById("app").innerHTML = `
        <div class="app">
          <aside class="sidebar">
            <div class="brand">
              <div class="brand-icon">HKL</div>
              <div>
                <div style="font-weight:800">HKL Club</div>
                <div style="color:#94a3b8;font-size:13px">Challenge OS</div>
              </div>
            </div>

            <div class="nav">
              <button class="active">Dashboard</button>
              <button onclick="openHistory()">Full History</button>
              <button onclick="openAdmin()">Admin Access</button>
            </div>

            <div class="side-card">
              <small>Prize Pool</small>
              <h2>$${prizePool}</h2>
              <div style="color:#94a3b8;font-size:13px">Based on listed members</div>
            </div>

            <div class="side-card">
              <small>Mode</small>
              <h3>${state.isAdmin ? "Admin" : "Member"}</h3>
            </div>
          </aside>

          <main class="main">
            

           <section class="grid-main" id="home" style="display:block">
           <div class="page ${state.activePage === "log" ? "active" : ""}">
           <div style="margin-bottom:18px">
  <div class="eyebrow">Daily Check-In</div>
  <h1 style="font-size:32px;margin:8px 0 0">Log Points</h1>
  <p class="muted" style="margin-top:8px">Select what you completed today.</p>
</div>
              <div class="panel">
                <div class="panel-head">
                  <div class="eyebrow">Daily Submission</div>
                  <h2>Log completed actions</h2>
                </div>
                <div class="panel-body">
                  ${state.profileSaved ? `
                    <div class="profile-card" style="margin-bottom:24px">
                      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
                        <div style="display:flex;gap:12px;align-items:center">
                          <div class="avatar">${initials(state.selectedMember)}</div>
                          <div>
                            <strong>${state.selectedMember}</strong>
                            <div class="muted">
  ${currentTeam()?.name || ""}
  · Exercise ${selectedStats?.exercise || 0}d
  · Nitnem ${selectedStats?.nitnem || 0}d
  · Simran ${selectedStats?.simran || 0}d
  · Bachans ${selectedStats?.bachans || 0}d
</div>
                          </div>
                        </div>
                        <button class="btn-red" onclick="changeProfile()">Switch</button>
                      </div>
                    </div>
                  ` : `
                    <div class="profile-card">
                      <p style="font-weight:700;margin-top:0">Set up your profile on this device.</p>
                      <select onchange="
  state.selectedTeam = Number(this.value);
  state.selectedMember = state.teams.find(t => t.id === state.selectedTeam)?.members?.[0] || '';
  save();
  render();
">
                        ${state.teams.map(t => `<option value="${t.id}" ${t.id === state.selectedTeam ? "selected" : ""}>${t.name}</option>`).join("")}
                      </select>
                      <br><br>
                      <select onchange="state.selectedMember=this.value;save();render()">
                        ${(currentTeam()?.members || []).map(m => `<option ${m === state.selectedMember ? "selected" : ""}>${m}</option>`).join("")}
                      </select>
                      <br><br>
                      <button class="btn btn-dark" style="width:100%;margin-bottom:24px" onclick="saveProfile()">Save Profile</button>
                    </div>
                  `}

                  ${tasks.map(t => {
  const icons = {
  "Exercise for 45 mins": "dumbbell",
  "HKL pledge": "sparkles",
  "Nitnem or Japji Sahib": "book",
  "Sit with yourself for 10 mins": "brain",
  "Write grateful + befqoofia": "square-pen",
  "Morning Simran": "sun",
  "Listen to Bachans and take notes": "headphones",
  "HKL signup": "user-plus",
  "Bring someone new to an HKL club event": "users",
  "General kindness acts": "heart-handshake"
};

  return `
    <button class="task ${state.selectedTasks.includes(t[0]) ? "active" : ""}" onclick="toggleTask('${t[0]}')">

 <div class="task-icon">
  <i data-lucide="${icons[t[0]] || 'circle'}"></i>
</div>

  <div class="task-name">
    ${t[0]}
  </div>

  <div class="task-points">
    +${t[1]}
  </div>

</button>
  `;
}).join("")}

                  ${state.isAdmin ? `<input id="manualPoints" placeholder="Manual points override - admin only" type="number" style="margin-top:14px" />` : ""}
                  <input id="note" placeholder="Optional proof / note" style="margin-top:14px" />
                  <button class="btn btn-blue" style="width:100%;margin-top:14px" onclick="submitPoints()">Submit ${state.isAdmin ? "manual/selected" : selectedTotal} points</button>
                </div>
              </div>
              </div>

       
</section>
            <section class="summary page ${state.activePage === "teams" ? "active" : ""}" id="summary">

  <div class="hero-card">
  <div class="eyebrow">Welcome to</div>
  <h1>HKL Transformation Challenge</h1>
  <p class="muted">
    A team-based challenge built around discipline, seva, health, and daily consistency.
  </p>
</div>

<div style="margin-bottom:18px">
  <div class="eyebrow">HKL Challenge</div>
  <h1 style="font-size:32px;margin:8px 0 0">Team Rankings</h1>
</div>

  <div style="display:grid;gap:14px">

    ${lb.map((team, i) => `
      <div class="mobile-card" style="
        background:${i === 0 
          ? 'linear-gradient(135deg,#6d28d9,#315cff)' 
          : 'rgba(15,23,42,.92)'};
        border:${i === 0 
          ? '1px solid rgba(255,255,255,.12)' 
          : '1px solid rgba(148,163,184,.14)'};
        box-shadow:${i === 0
          ? '0 20px 50px rgba(99,102,241,.35)'
          : '0 12px 30px rgba(0,0,0,.28)'};
      ">

        <div style="display:flex;justify-content:space-between;align-items:center">

          <div>
            <div style="
              font-size:13px;
              font-weight:800;
              opacity:.8;
              margin-bottom:6px;
            ">
              ${i === 0 ? "👑 FIRST PLACE" : `#${i+1} TEAM`}
            </div>

            <h2 style="margin:0">${team.name}</h2>

            <div class="muted" style="margin-top:6px">
              ${team.members.join(", ")}
            </div>
          </div>

          <div style="text-align:right">
            <div style="font-size:34px;font-weight:900">
              ${team.total}
            </div>

            <div style="font-size:13px;opacity:.75">
              +${team.today} today
            </div>
          </div>

        </div>

        <div class="bar" style="
          width:100%;
          margin-top:18px;
          background:rgba(255,255,255,.14);
        ">
          <div class="fill" style="
            width:${Math.min(100, team.total / topTeam * 100)}%;
            background:white;
          "></div>
        </div>

      </div>
    `).join("")}

  </div>
<div style="margin-top:22px">

  <div class="eyebrow">Top Performers</div>

  <div style="
    display:grid;
    gap:12px;
    margin-top:12px;
  ">

    <div class="mobile-card">
      <div style="display:flex;justify-content:space-between;align-items:center">

    async function loadFromSheet() {
  const res = await fetch("https://script.google.com/macros/s/AKfycbzYpou1mRPjxW6fKNViOQgmxT3GFkvn8xVGQjlO3bOEf5grRjLStMNjQjA91ggc8BvY/exec");
  const data = await res.json();

  const teamRows = data.teams.slice(1);
  state.teams = teamRows.map((r, i) => ({
    id: i + 1,
    name: r[0],
    members: String(r[1]).split(",").map(x => x.trim()).filter(Boolean)
  }));

  const logRows = data.logs.slice(1);
  state.logs = logRows.map((r, i) => ({
    id: i,
    teamId: state.teams.find(t => t.name === r[0])?.id,
    member: r[1],
    task: r[2],
    points: Number(r[3]),
    note: r[4],
    date: String(r[5]).slice(0, 10)
  }));

  render();
}
    loadFromSheet();
   setInterval(() => {
  const activeTag = document.activeElement?.tagName;

  if (
    !state.showAdmin &&
    !state.showHistory &&
    activeTag !== "INPUT" &&
    activeTag !== "SELECT"
  ) {
    loadFromSheet();
  }
}, 5000);
