<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HKL</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f5f7fa;
  color:#111827;
}

.task{
  width:100%;
  border:1px solid #e2e8f0;
  background:white;
  border-radius:12px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

/* ✅ FIXED ACTIVE STYLE */
.task.active{
  background:#f1f5f9;
  color:#111827;
  border-color:#cbd5e1;
}

/* ✅ FIXED POINTS COLOR */
.task span:last-child{
  color:#111827;
  font-weight:700;
}

button{
  cursor:pointer;
  border:none;
  padding:10px;
  border-radius:10px;
  background:#111827;
  color:white;
  margin-top:10px;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}
</style>

</head>

<body>

<div class="container">
<h2>Daily Tasks</h2>

<div id="tasks"></div>

<button onclick="submit()">Submit</button>

</div>

<script>
const tasks = [
  ["Wake up for Simran",10],
  ["Daily pledge",5],
  ["Exercise for 45 minutes",15]
];

let selected = [];

function render(){
  document.getElementById("tasks").innerHTML =
    tasks.map(t => `
      <div class="task ${selected.includes(t[0]) ? "active" : ""}" onclick="toggle('${t[0]}')">
        <span>${t[0]}</span>
        <span>+${t[1]}</span>
      </div>
    `).join("");
}

function toggle(name){
  if(selected.includes(name)){
    selected = selected.filter(t => t !== name);
  } else {
    selected.push(name);
  }
  render();
}

function submit(){
  alert("Submitted: " + selected.join(", "));
  selected = [];
  render();
}

render();
</script>

</body>
</html>
